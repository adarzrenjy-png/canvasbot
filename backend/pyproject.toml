[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "jig"
version = "0.1.0"
description = "Describe a part; a team of Meta Muse agents builds a parametric, verified build123d model."
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "build123d>=0.13,<0.14",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "python-multipart>=0.0.9",
  "gmsh>=4.13",  # GPL-2.0-or-later: the FEA mesher named in the project brief
  "numpy>=2",
  "shapely>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "pygerber>=2.4"]

[tool.hatch.build.targets.wheel]
packages = ["src/jig"]

[tool.pytest.ini_options]
testpaths = ["tests"]
