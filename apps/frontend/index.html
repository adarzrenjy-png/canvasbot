<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Cadence is a local-first adaptive academic planner." />
    <meta name="color-scheme" content="light dark" />
    <title>Cadence — Adaptive Academic Planner</title>
    <script>
      // Resolve the theme before first paint so the window never flashes the wrong background.
      (function () {
        try {
          var stored = localStorage.getItem('cadence-theme') || 'system'
          var resolved = stored === 'system'
            ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
            : stored
          document.documentElement.dataset.theme = resolved
          document.documentElement.style.background = resolved === 'dark' ? '#212121' : '#ffffff'
        } catch (error) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
