name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is Apple Silicon; macos-15-intel covers Intel Macs. Ubuntu runs the
        # FEA accuracy tests with CalculiX from apt.
        os: [macos-latest, macos-15-intel, windows-latest, ubuntu-latest]
    # Every step uses the runner's default shell (PowerShell on Windows), so CI
    # exercises the same commands a user types on each OS.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install CalculiX (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y calculix-ccx libglu1-mesa libxcursor1 libxft2 libxinerama1

      - name: Install CalculiX (macOS)
        if: runner.os == 'macOS'
        continue-on-error: true  # FEA tests skip if the tap fails to build
        run: brew install costerwi/calculix/calculix-ccx

      - name: Install the backend
        run: python -m pip install -e "./backend[dev]"

      - name: Lint
        run: python -m ruff check backend scripts

      - name: Backend tests
        working-directory: backend
        run: python -m pytest -q

      - name: Install the UI
        working-directory: frontend
        run: npm ci

      - name: Type-check and build the UI
        working-directory: frontend
        run: npm run build

      - name: Build the sample part with the launcher
        run: python scripts/jig.py sample --out build-output

      - name: Check the setup report
        run: python scripts/jig.py doctor

      - uses: actions/upload-artifact@v4
        with:
          name: sample-part-${{ matrix.os }}
          path: build-output/
