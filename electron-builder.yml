appId: com.cadence.academicos
productName: Cadence
copyright: Cadence

directories:
  output: release
  buildResources: build

# Only compiled output ships. Python sources stay out of the bundle: the
# backend travels as the PyInstaller binary in extraResources instead.
files:
  - package.json
  - apps/desktop/dist/**/*
  - apps/frontend/dist/**/*
  - '!**/*.{map,md,markdown,ts,tsx}'
  - '!**/{test,tests,__tests__,__pycache__,.github,.vscode}/**'

extraResources:
  - from: release/backend
    to: backend
    filter:
      - '**/*'

# Playwright shells out to its own driver, which cannot execute from inside an
# asar archive.
asarUnpack:
  - '**/node_modules/playwright/**'
  - '**/node_modules/playwright-core/**'

mac:
  category: public.app-category.education
  icon: build/icon.png
  # Architecture is supplied by scripts/build-mac.sh, which pins it to the host.
  # PyInstaller cannot cross-compile the bundled backend, so a build must never
  # package an Electron architecture the frozen binary does not match.
  target:
    - dmg
    - zip
  # Signing is opt-in. Without a Developer ID in the environment,
  # scripts/build-mac.sh passes an ad-hoc identity, which Apple silicon requires
  # in order to launch the app at all.
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    LSMinimumSystemVersion: '11.0'
    NSHumanReadableCopyright: Cadence
    # Cadence never records; this is required only because the bundled Chromium
    # for the managed Canvas browser links the media frameworks.
    NSCameraUsageDescription: Cadence does not use the camera.
    NSMicrophoneUsageDescription: Cadence does not use the microphone.

dmg:
  artifactName: ${productName}-${version}-${arch}.dmg
  title: ${productName} ${version}
  window:
    width: 540
    height: 380
  contents:
    - x: 140
      y: 200
      type: file
    - x: 400
      y: 200
      type: link
      path: /Applications
