# Lint and format settings for all Python in the repo (backend and scripts).
line-length = 100
target-version = "py311"
src = ["backend/src", "backend"]

[lint]
select = ["E", "F", "W", "I", "B", "UP"]

[lint.per-file-ignores]
# HTML and SVG templates read better unwrapped.
"backend/src/jig/report/*.py" = ["E501"]
